{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="cartao login-pagina">
  <h1>Entrar</h1>
  <form method="post" class="formulario-simples">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Login
      <input name="login" required autofocus autocomplete="username">
    </label>
    <label>Senha
      <input name="senha" type="password" required autocomplete="current-password">
    </label>
    <button class="btn">Entrar</button>
    <p>Não tem acesso? <a href="{{ url_for('cadastro') }}">Criar acesso</a></p>
  </form>
</div>
{% endblock %}
